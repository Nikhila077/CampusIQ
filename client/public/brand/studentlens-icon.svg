<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Deep Charcoal Base -->
  <rect width="100" height="100" rx="22" fill="#102A2A"/>
  
  <!-- Outer Focus Ring (Teal) -->
  <circle cx="50" cy="50" r="32" stroke="#3B8F83" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="145 25"/>
  
  <!-- Soft Mint Inner Iris Ring -->
  <circle cx="50" cy="50" r="21" fill="#E8F5F2" fill-opacity="0.2" stroke="#E8F5F2" stroke-width="2"/>
  
  <!-- Subtle S-curve Insight Wave -->
  <path d="M42 36C47 36 53 40 50 50C47 60 53 64 58 64" stroke="#3B8F83" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Focal Point (Pupil / Insight Node) -->
  <circle cx="50" cy="50" r="5" fill="#3B8F83"/>
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF"/>
</svg>
